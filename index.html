function vList(){const bad=/andika|\bmale\b|pria|laki/i,

 return speechSynthesis.getVoices().filter(v=>(/^id/i.test(v.lang)||/indonesia/i.test(v.name))&&!bad.test(v.name)).sort((a,b)=>rank(b)-rank(a))}
function nextVoice(){const L=vList();if(!L.length)return cap('Tidak ada suara Indonesia di perangkat ini. Aktifkan lewat Pengaturan > Text-to-speech.');
 vSel=L[(L.indexOf(vSel)+1)%L.length];say('Halo, ini suara baru saya. Semoga terdengar lebih jelas.')}

function say(t){cap(t);if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
 const s=t.replace(/Rp([\d.]+)/g,'$1 rupiah').replace(/\b[A-Z]{4}\b/g,m=>CH.some(c=>c.n==m)?m:m.split('').join(' ')).replace(/[·–]/g,',');
 const u=new SpeechSynthesisUtterance(s);u.lang='id-ID';u.pitch=ch.p;u.rate=ch.r;
 const v=vSel||vList()[0];if(v){u.voice=v;u.lang=v.lang}
 u.onstart=()=>document.body.classList.add('talk');u.onend=u.onerror=()=>document.body.classList.remove('talk');speechSynthesis.speak(u)}

async function get(p,u){const c=new AbortController(),tm=setTimeout(()=>c.abort(),7000),nm=p=='direct'?'langsung':p.replace(/^https:\/\//,'').split('/')[0];

function an(t,d){const c=d.map(x=>x.c),n=c.length,P=c[n-1],m20=sma(c,20),m50=sma(c,50);

 const vr=d[n-1].v/(avg(d.slice(-21,-1).map(x=>x.v))||1),atr=avg(d.slice(-14).map(x=>x.h-x.l)),r20=P/c[n-21]-1;

function mc(c){const r=[];for(let i=Math.max(1,c.length-250);i<c.length;i++)r.push(Math.log(c[i]/c[i-1]));

 for(let i=19;i<c.length;i++){const m=avg(c.slice(i-19,i+1));i==19?x.moveTo(X(i),Y(m)):x.lineTo(X(i),Y(m))}x.stroke()}
function show(a,m){const buy=a.m20-.5*a.atr,sl=buy-1.5*a.atr,tp=buy+3*a.atr,col=a.s>=55?'up':a.s<40?'dn':'';
 $('#out').innerHTML=`<div class="cards"><div class="c"><small>${a.t} · harga${DEMO?' · DEMO':''}</small><b>${rp(a.P)}</b></div><div class="c"><small>Skor</small><b class="${col}">${a.s}/100</b></div><div class="c"><small>RSI · MA20 / MA50</small><b>${a.rsi.toFixed(0)}</b><small>${rp(a.m20)} / ${rp(a.m50)}</small></div><div class="c"><small>Peluang naik 30 hari</small><b>${m.up.toFixed(0)}%</b><small>${rp(m.p10)} – ${rp(m.p90)}</small></div></div><div class="c" style="margin-bottom:8px"><b class="${col}">${a.v}</b><small>Beli ideal ${rp(buy)} · Stop ${rp(sl)} · Target ${rp(tp)}</small></div><canvas id="cv"></canvas>`;
 chart(a.c.slice(-120))}

async function analyze(t,mode){say(`Mengambil data ${t}…`);$('#out').innerHTML='';
 try{const a=await one(t),m=mc(a.c);show(a,m);
  say(`${DEMO?'Data simulasi. ':''}${t} harga ${rp(a.P)}, skor ${a.s} dari 100, ${a.v.toLowerCase()}. Peluang naik 30 hari ${m.up.toFixed(0)} persen.`+(mode=='harga'?` Harga beli ideal sekitar ${rp(a.m20-.5*a.atr)}.`:''))}
 catch(e){say(`Gagal mengambil data ${t}. Coba lagi, atau ketuk Pengaturan proxy atau Mode demo.`);diag()}}
async function scan(){say(`Memindai ${WATCH.length} saham…`);$('#out').innerHTML='';
 const res=[];for(let i=0;i<WATCH.length;i+=5)res.push(...await Promise.allSettled(WATCH.slice(i,i+5).map(t=>one(t))));const r=res.filter(x=>x.status=='fulfilled').map(x=>x.value).sort((a,b)=>b.s-a.s);
 if(!r.length){say('Gagal mengambil data. Ketuk Pengaturan proxy atau Mode demo.');return diag()}
 $('#out').innerHTML=r.slice(0,6).map(a=>`<div class="row" onclick="run('analisa ${a.t}')"><span><b>${a.t}</b> ${rp(a.P)}</span><span class="${a.s>=55?'up':'dn'}">${a.s} · ${a.v}</span></div>`).join('');
 say(`${DEMO?'Data simulasi. ':''}Top saham hari ini: ${r.slice(0,3).map(a=>a.t+' skor '+a.s).join(', ')}. Ketuk salah satu untuk analisa lengkap.`)}

const KW=/analisa|analisis|prediksi|rekomendasi|harga|beli|saham|cari|tolong|dong|monte|carlo|tentang|untuk|bagus|kode|yang|saja|coba|mana/g;
function run(t){t=(t||'').trim();if(!t)return;$('#q').value='';$('#q').blur();
 const l=t.toLowerCase(),tk=(l.replace(KW,' ').match(/\b[a-z]{4}\b/)||[])[0];
 if(/bantuan|help|bisa apa/.test(l))say('Coba: cari saham bagus, analisa BBCA, prediksi TLKM, atau harga beli BBRI. Ucapkan lewat tombol mikrofon atau ketik.');
 else if(tk)analyze(tk.toUpperCase(),/harga|beli/.test(l)?'harga':'');
 else if(/cari|screen|saham|top|bagus/.test(l))scan();
 else say('Maaf, saya belum paham. Katakan bantuan untuk contoh perintah.')}
</script></body></html>
