<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a1a2f">
    <meta name="description" content="SUHU AI Agent V3 - Asisten AI Interaktif">
    <title>SUHU AI Agent V3</title>

    <!-- Disarankan menggunakan path file eksternal untuk efisiensi loading -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <!-- CSS Modern & Responsive Layout -->
    <style>
        :root {
            --bg-color: #0a1a2f;
            --card-bg: #132a4a;
            --text-color: #ffffff;
            --accent-color: #00d2ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
        }

        .chat-box {
            height: 400px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #0a1a2f;
            color: #fff;
            outline: none;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: var(--accent-color);
            color: #0a1a2f;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SUHU AI Agent V3</h1>
        </header>

        <main>
            <div id="chatBox" class="chat-box">
                <!-- Area Pesan / Chat -->
            </div>

            <div class="input-group">
                <input type="text" id="userInput" placeholder="Ketik pesan atau perintah..." />
                <button onclick="sendMessage()">Kirim</button>
            </div>
        </main>
    </div>

    <!-- JavaScript Logika Interaktif -->
    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            
            if (input.value.trim() === '') return;

            // Tambahkan pesan pengguna
            const userMsg = document.createElement('div');
            userMsg.style.marginBottom = '10px';
            userMsg.style.textAlign = 'right';
            userMsg.innerHTML = `<strong>Pesan:</strong> ${input.value}`;
            chatBox.appendChild(userMsg);

            // Reset input
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
